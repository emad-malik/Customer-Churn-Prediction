name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REGISTRY: 050007037432.dkr.ecr.us-east-1.amazonaws.com

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint with ruff
        run: uv run ruff check src/

      - name: Run tests
        run: uv run pytest tests/ -v || [ "$?" = "5" ]

  build-and-push:
    name: Build & Push to ECR
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push inference image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/inference/Dockerfile
          target: runtime
          push: true
          tags: ${{ env.ECR_REGISTRY }}/churn-inference:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push training image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/training/Dockerfile
          target: runtime
          push: true
          tags: ${{ env.ECR_REGISTRY }}/churn-training:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | \
              docker login --username AWS --password-stdin 050007037432.dkr.ecr.us-east-1.amazonaws.com

            docker pull 050007037432.dkr.ecr.us-east-1.amazonaws.com/churn-inference:latest
            docker pull 050007037432.dkr.ecr.us-east-1.amazonaws.com/churn-training:latest

            cd /home/ubuntu/app
            git pull origin main
            docker-compose pull
            docker-compose up -d --remove-orphans