[project]
name = "Churn-Prediction"
version = "0.1.0"
description = "Churn Prediction on Telco Customer Churn"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Core — shared by all entry points
    "numpy==1.26.4",
    "pandas==2.2.2",
    "scikit-learn==1.4.2",
    "scipy==1.13.0",
    "joblib==1.4.2",
    "setuptools>=65.0.0,<81.0.0",
]

[project.optional-dependencies]
training = [
    "xgboost==2.0.3",
    "lightgbm==4.3.0",
    "imbalanced-learn==0.12.3",
    "shap>=0.45",
    "matplotlib==3.8.4",
    "mlflow==2.13.0",
    "prometheus-client==0.20.0",
]
inference = [
    "xgboost==2.0.3",
    "lightgbm==4.3.0",
    "mlflow==2.13.0",
    "fastapi==0.111.0",
    "uvicorn[standard]==0.29.0",
    "pydantic==2.7.1",
    "prometheus-client==0.20.0",
]
drift = [
    "xgboost==2.0.3",
    "lightgbm==4.3.0",
    "imbalanced-learn==0.12.3",
    "matplotlib==3.8.4",
    "mlflow==2.13.0",
    "requests>=2.31.0",
]
dev = [
    "ruff>=0.4.0",
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/churn"]

[project.scripts]
churn-train           = "churn.cli:train_main"
churn-evaluate        = "churn.cli:evaluate_main"
churn-train-all       = "churn.train_all:main"
churn-benchmark       = "churn.benchmark:main"
churn-drift-simulation = "churn.drift_simulation:main"
