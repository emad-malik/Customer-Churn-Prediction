[project]
name = "Churn-Prediction"
version = "0.1.0"
description = "Churn Prediction on Telco Customer Churn"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "numpy==1.26.4",
    "pandas==2.3.2",
    "scikit-learn==1.4.2",
    "xgboost==2.0.3",
    "shap>=0.45",
    "matplotlib==3.10.7",
    "scipy==1.16.2",
    "joblib==1.4.2",
    "lightgbm==4.3.0",
    "imbalanced-learn==0.12.3",
    "mlflow==2.13.0",
    "boto3==1.34.100",
    "psycopg2-binary==2.9.9",
    "fastapi==0.111.0",
    "uvicorn[standard]==0.29.0",
    "pydantic==2.7.1",
    "httpx==0.27.0",
    "prometheus-client==0.20.0",
    "prometheus-fastapi-instrumentator==6.1.0",
    "evidently==0.4.30",
    "seaborn==0.13.2",
    "pyyaml==6.0.1",
    "python-dotenv==1.0.1",
    "tqdm==4.66.4",
    "setuptools>=65.0.0,<81.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/churn"]

[project.scripts]
churn-train    = "churn.cli:train_main"
churn-evaluate = "churn.cli:evaluate_main"
