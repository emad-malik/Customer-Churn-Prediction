[project]
name = "Churn-Prediction"
version = "0.1.0"
description = "Churn Prediction on Telco Customer Churn"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "shap>=0.45",
    "matplotlib>=3.8",
    "scipy>=1.12",
    "joblib>=1.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/churn"]

[project.scripts]
churn-train    = "churn.cli:train_main"
churn-evaluate = "churn.cli:evaluate_main"
