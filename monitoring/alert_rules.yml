groups:
  - name: churn_model_alerts
    interval: 30s
    rules:

      # ── Accuracy drops below threshold ─────────────────────────────────
      - alert: ModelAccuracyLow
        expr: churn_model_accuracy_gauge < 0.85
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Churn model accuracy below 0.85"
          description: >
            Model accuracy is {{ $value | humanizePercentage }}.
            Investigate for distribution shift or model staleness.

      # ── Drift score exceeds warning threshold ──────────────────────────
      - alert: DriftScoreHigh
        expr: churn_psi_score_gauge > 0.2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "PSI drift score exceeds 0.2"
          description: >
            Population Stability Index is {{ $value | humanize }}.
            Values >0.2 indicate significant distribution shift.

      # ── Prediction latency p99 > 500 ms ───────────────────────────────
      - alert: HighPredictionLatency
        expr: >
          histogram_quantile(0.99,
            rate(churn_prediction_latency_seconds_bucket[5m])
          ) > 0.5
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "p99 prediction latency exceeds 500ms"
          description: >
            99th-percentile latency is
            {{ $value | humanizeDuration }}.

      # ── Churn rate (fraction of positive predictions) too high ─────────
      - alert: ChurnRateSpiking
        expr: >
          rate(churn_predictions_total{predicted_class="1"}[10m])
          / rate(churn_predictions_total[10m]) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Churn prediction rate exceeds 50%"
          description: >
            More than half of recent predictions are churn.
            May indicate real shift or a data pipeline issue.

      # ── API down ───────────────────────────────────────────────────────
      - alert: APIDown
        expr: up{job="churn-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Churn API is unreachable"
          description: "Prometheus cannot scrape churn-api /metrics."
