global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'churn-mlops'

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  # ── FastAPI application (for inference metrics) ────────────────
  - job_name: 'fastapi'
    static_configs:
      - targets: ['fastapi_app:8000']
    metrics_path: '/metrics'
    scrape_interval: 15s

  # ── Pushgateway (for training metrics pushed after churn-train) ─
  - job_name: 'pushgateway'
    static_configs:
      - targets: ['pushgateway:9091']
    honor_labels: true
    scrape_interval: 15s

  # ── Prometheus itself ──────────────────────────────────────────
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
