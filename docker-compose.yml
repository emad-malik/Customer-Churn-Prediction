# ── Shared network ──────────────────────────────────────────────────────────
networks:
  churn-net:
    driver: bridge

# ── Named volumes ───────────────────────────────────────────────────────────
volumes:
  mlflow-data:
  prometheus-data:
  grafana-data:

# ═══════════════════════════════════════════════════════════════════════════
services:

  # ── 1. MLflow tracking server ────────────────────────────────────────────
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.13.0
    container_name: churn-mlflow
    ports:
      - "5000:5000"
    volumes:
      - mlflow-data:/mlflow
    command: >
      mlflow server
        --backend-store-uri sqlite:////mlflow/mlflow.db
        --default-artifact-root /mlflow/artifacts
        --host 0.0.0.0
        --port 5000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - churn-net

  # ── 2. FastAPI inference server ──────────────────────────────────────────
  fastapi_app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: churn-api
    ports:
      - "8000:8000"
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MODEL_NAME: churn_best_model
      MODEL_STAGE: Production
      LOG_LEVEL: info
    volumes:
      # Mount outputs so trained models are accessible without rebuilding
      - ./outputs:/app/outputs:ro
    depends_on:
      mlflow:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 5
    networks:
      - churn-net

  # ── 3. Prometheus ────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: churn-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
      - "--web.enable-admin-api"
    depends_on:
      - fastapi_app
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - churn-net

  # ── 4. Grafana ───────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.2
    container_name: churn-grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Auto-provision datasource + dashboard
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
      GF_UNIFIED_ALERTING_ENABLED: "true"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana-provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - churn-net